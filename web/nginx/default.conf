server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 22m;   # knowledge pack uploads
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Asset URLs carry a version (?v=...), so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # Resolve "php" through Docker's DNS on every request. With a fixed name
        # nginx keeps the address it saw at start, and answers 502 after the php
        # container is recreated with a new address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # The chat streams from the local LLM; a long prompt can take minutes before
        # the first token. php sends X-Accel-Buffering: no, so nginx passes it through.
        fastcgi_read_timeout 600s;
        # Large enough for a full JSON reply, so nginx never spills it to disk.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 32 16k;
    }

    location ~ /\. { deny all; }
}
